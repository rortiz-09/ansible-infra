---
- name: Install Linux hardening audit tools
  hosts: "{{ target_hosts | default('trusted_linux') }}"
  gather_facts: true
  become: true
  serial: "{{ linux_hardening_serial | default(20) }}"

  vars:
    linux_hardening_install_tools: "{{ install_hardening_tools | default(false) | bool }}"

  tasks:
    - name: Require explicit limit for tool installation
      ansible.builtin.assert:
        that:
          - ansible_limit is defined
          - ansible_limit | length > 0
          - linux_hardening_install_tools
        fail_msg: "Use --limit and -e install_hardening_tools=true to install packages."

    - name: Install RedHat family hardening tools
      ansible.builtin.package:
        name:
          - openscap-scanner
          - scap-security-guide
          - audit
          - chrony
          - firewalld
        state: present
      when: ansible_facts.os_family == 'RedHat'

    - name: Install Ubuntu/Debian hardening tools
      ansible.builtin.package:
        name:
          - openscap-scanner
          - auditd
          - audispd-plugins
          - chrony
          - ufw
          - lynis
        state: present
      when: ansible_facts.os_family == 'Debian'

    - name: Install Ubuntu Security Guide when available
      ansible.builtin.package:
        name: ubuntu-security-guide
        state: present
      failed_when: false
      when: ansible_facts.distribution == 'Ubuntu'

    - name: Install SUSE hardening tools
      ansible.builtin.package:
        name:
          - openscap
          - scap-security-guide
          - audit
        state: present
      when: ansible_facts.os_family == 'Suse'
