---
- name: Reinicio controlado de servidores Linux
  hosts: linux
  gather_facts: false
  become: true
  serial: "{{ reboot_serial | default(5) }}"
  vars:
    allow_reboot: false

  pre_tasks:
    - name: Exigir limite explicito
      ansible.builtin.assert:
        that:
          - ansible_limit is defined
          - ansible_limit | length > 0
        fail_msg: "Ejecuta con --limit, por ejemplo --limit linux_prod_gye o --limit one_host."

    - name: Exigir aprobacion explicita de reinicio
      ansible.builtin.assert:
        that:
          - allow_reboot | bool
        fail_msg: "Define -e allow_reboot=true despues de confirmar la ventana de mantenimiento."

  tasks:
    - name: Reiniciar host Linux y esperar SSH
      ansible.builtin.reboot:
        reboot_timeout: 900
        connect_timeout: 20
        post_reboot_delay: 30
        test_command: whoami

    - name: Validar que el host regreso
      ansible.builtin.ping:
