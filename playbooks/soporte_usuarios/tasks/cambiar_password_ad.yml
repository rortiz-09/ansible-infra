---
- name: Validate manual password length before AD change
  ansible.builtin.assert:
    that:
      - support_custom_password_effective | length >= 14
    fail_msg: "La contrasena manual debe tener al menos 14 caracteres antes de enviarla a AD."
  when: support_password_mode_normalized in ['2', 'manual']

- name: Reset AD user password with support rules
  ansible.windows.win_shell:
    cmd: |
      $ErrorActionPreference = 'Stop'
      Import-Module ActiveDirectory

      $Sam = {{ support_user_normalized | to_json }}
      $Mode = {{ support_password_mode_normalized | to_json }}
      $ManualPassword = {{ support_custom_password_effective | default('') | to_json }}
      $RevealPassword = [System.Convert]::ToBoolean({{ support_show_password | default(true) | bool | ternary('"true"', '"false"') }})
      $MustChangeAtLogon = [System.Convert]::ToBoolean({{ support_must_change_password_bool | bool | ternary('"true"', '"false"') }})
      $UnlockIfLocked = [System.Convert]::ToBoolean({{ support_unlock_after_reset_bool | bool | ternary('"true"', '"false"') }})
      $IncludeUserName = [System.Convert]::ToBoolean({{ support_auto_password_include_username | default(false) | bool | ternary('"true"', '"false"') }})
      $Year = (Get-Date).Year

      function New-SupportPassword {
        param(
          [string] $UserName,
          [int] $Year,
          [bool] $IncludeUserName
        )

        if ($IncludeUserName) {
          $base = "Xtrim$Year.$UserName"
        } else {
          $base = "Xtrim$Year.Soporte!"
        }

        if ($base.Length -ge 14) {
          return $base
        }

        $padSource = 'Soporte!2026'
        while ($base.Length -lt 14) {
          $remaining = 14 - $base.Length
          if ($remaining -ge $padSource.Length) {
            $base += $padSource
          } else {
            $base += $padSource.Substring(0, $remaining)
          }
        }

        return $base
      }

      $user = Get-ADUser -Identity $Sam -Properties LockedOut,Enabled,PasswordLastSet,pwdLastSet,LastBadPasswordAttempt,badPwdCount
      $wasLocked = [bool]$user.LockedOut

      if ($Mode -in @('1', 'auto')) {
        $newPassword = New-SupportPassword -UserName $user.SamAccountName.ToLowerInvariant() -Year $Year -IncludeUserName $IncludeUserName
        $passwordMode = 'auto'
      } elseif ($Mode -in @('2', 'manual')) {
        if ([string]::IsNullOrWhiteSpace($ManualPassword)) {
          throw "La contrasena manual no puede estar vacia."
        }
        $newPassword = $ManualPassword
        $passwordMode = 'manual'
      } else {
        throw "Modo de contrasena invalido: $Mode"
      }

      if ($newPassword.Length -lt 14) {
        throw "La contrasena resultante tiene menos de 14 caracteres."
      }

      $securePassword = ConvertTo-SecureString $newPassword -AsPlainText -Force
      try {
        Set-ADAccountPassword -Identity $user.SamAccountName -NewPassword $securePassword -Reset
      } catch {
        throw "AD rechazo la contrasena por politica de dominio, historial, complejidad o longitud. Detalle: $($_.Exception.Message)"
      }
      Set-ADUser -Identity $user.SamAccountName -ChangePasswordAtLogon $MustChangeAtLogon

      $unlockAction = 'not_requested'
      if ($UnlockIfLocked) {
        if ($wasLocked) {
          Unlock-ADAccount -Identity $user.SamAccountName
          $unlockAction = 'unlocked'
        } else {
          Unlock-ADAccount -Identity $user.SamAccountName
          $unlockAction = 'requested_but_not_locked'
        }
      }

      $updated = Get-ADUser -Identity $Sam -Properties LockedOut,Enabled,PasswordLastSet,pwdLastSet,LastBadPasswordAttempt,badPwdCount

      [pscustomobject]@{
        SamAccountName = $updated.SamAccountName
        Enabled = $updated.Enabled
        PasswordMode = $passwordMode
        Password = if ($RevealPassword) { $newPassword } else { '[oculta]' }
        PasswordLength = $newPassword.Length
        MustChangeAtNextLogon = ($updated.pwdLastSet -eq 0)
        RequestedMustChangeAtNextLogon = $MustChangeAtLogon
        WasLocked = $wasLocked
        LockedOut = $updated.LockedOut
        UnlockRequested = $UnlockIfLocked
        UnlockAction = $unlockAction
        BadPwdCount = $updated.badPwdCount
        LastBadPasswordAttempt = if ($updated.LastBadPasswordAttempt) { $updated.LastBadPasswordAttempt.ToString('yyyy-MM-dd HH:mm:ss') } else { $null }
        PasswordLastSet = if ($updated.PasswordLastSet) { $updated.PasswordLastSet.ToString('yyyy-MM-dd HH:mm:ss') } else { $null }
      } | ConvertTo-Json -Compress
  register: support_password_result
  changed_when: support_password_result.rc == 0

- name: Show password reset result
  ansible.builtin.debug:
    msg: "{{ support_password_result.stdout | from_json }}"
