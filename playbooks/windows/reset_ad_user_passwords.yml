---
- name: Reset AD user passwords in bulk
  hosts: "{{ ad_password_reset_target | default('xtrimad_01') }}"
  gather_facts: false
  any_errors_fatal: true

  vars:
    ad_password_reset_length: 14
    ad_password_reset_show_passwords: false
    ad_password_reset_unlock: true
    ad_password_reset_change_at_logon: false
    ad_password_reset_users: []

  pre_tasks:
    - name: Validate user list
      ansible.builtin.assert:
        that:
          - ad_password_reset_users is iterable
          - ad_password_reset_users | length > 0
          - ad_password_reset_length | int >= 14
        fail_msg: "Define ad_password_reset_users with one or more SamAccountName values and length >= 14."
      run_once: true

  tasks:
    - name: Reset passwords, unlock accounts, and set logon password-change flag
      ansible.windows.win_shell: |
        $ErrorActionPreference = 'Stop'
        Import-Module ActiveDirectory

        $users = '{{ ad_password_reset_users | to_json }}' | ConvertFrom-Json
        $length = {{ ad_password_reset_length | int }}
        $includePasswords = {{ ad_password_reset_show_passwords | bool | ternary('$true', '$false') }}
        $unlockAccounts = {{ ad_password_reset_unlock | bool | ternary('$true', '$false') }}
        $changeAtLogon = {{ ad_password_reset_change_at_logon | bool | ternary('$true', '$false') }}

        $upper = 'ABCDEFGHJKLMNPQRSTUVWXYZ'.ToCharArray()
        $lower = 'abcdefghijkmnopqrstuvwxyz'.ToCharArray()
        $digits = '23456789'.ToCharArray()
        $special = '!@#$%*+-_='.ToCharArray()
        $allChars = @($upper + $lower + $digits + $special)
        $rng = [System.Security.Cryptography.RandomNumberGenerator]::Create()

        function Get-RandomIndex {
          param([int] $Max)

          $bytes = New-Object byte[] 4
          do {
            $rng.GetBytes($bytes)
            $value = [BitConverter]::ToUInt32($bytes, 0)
            $limit = [uint32]::MaxValue - ([uint32]::MaxValue % [uint32]$Max)
          } while ($value -ge $limit)

          return [int]($value % $Max)
        }

        function Get-RandomChar {
          param([char[]] $Chars)
          return $Chars[(Get-RandomIndex -Max $Chars.Length)]
        }

        function New-ComplexPassword {
          param([int] $PasswordLength)

          $chars = New-Object System.Collections.Generic.List[char]
          $chars.Add((Get-RandomChar -Chars $upper))
          $chars.Add((Get-RandomChar -Chars $lower))
          $chars.Add((Get-RandomChar -Chars $digits))
          $chars.Add((Get-RandomChar -Chars $special))

          while ($chars.Count -lt $PasswordLength) {
            $chars.Add((Get-RandomChar -Chars $allChars))
          }

          for ($i = $chars.Count - 1; $i -gt 0; $i--) {
            $j = Get-RandomIndex -Max ($i + 1)
            $tmp = $chars[$i]
            $chars[$i] = $chars[$j]
            $chars[$j] = $tmp
          }

          return -join $chars
        }

        $usedPasswords = New-Object 'System.Collections.Generic.HashSet[string]'
        $result = @()

        foreach ($samRaw in $users) {
          $sam = [string]$samRaw
          $password = New-ComplexPassword -PasswordLength $length
          while (-not $usedPasswords.Add($password)) {
            $password = New-ComplexPassword -PasswordLength $length
          }

          $adUser = Get-ADUser -Identity $sam -Properties LockedOut,Enabled,PasswordLastSet,pwdLastSet
          $securePassword = ConvertTo-SecureString $password -AsPlainText -Force

          Set-ADAccountPassword -Identity $adUser.SamAccountName -NewPassword $securePassword -Reset

          if ($unlockAccounts -and $adUser.LockedOut) {
            Unlock-ADAccount -Identity $adUser.SamAccountName
          }

          Set-ADUser -Identity $adUser.SamAccountName -ChangePasswordAtLogon $changeAtLogon

          $updatedUser = Get-ADUser -Identity $adUser.SamAccountName -Properties LockedOut,Enabled,PasswordLastSet,pwdLastSet
          $row = [ordered]@{
            SamAccountName = $updatedUser.SamAccountName
            Enabled = $updatedUser.Enabled
            LockedOut = $updatedUser.LockedOut
            PasswordLastSet = $updatedUser.PasswordLastSet.ToString('yyyy-MM-dd HH:mm:ss')
            MustChangeAtNextLogon = ($updatedUser.pwdLastSet -eq 0)
            WasLockedBefore = $adUser.LockedOut
          }

          if ($includePasswords) {
            $row.Password = $password
          }

          $result += [PSCustomObject]$row
        }

        $rng.Dispose()
        $result | ConvertTo-Json -Compress
      register: ad_password_reset_result

    - name: Show reset result
      ansible.builtin.debug:
        msg: "{{ ad_password_reset_result.stdout | from_json }}"
