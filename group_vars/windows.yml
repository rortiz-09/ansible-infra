---
# WinRM/Kerberos defaults for Windows hosts.
# Store vault_windows_svc_ansible_password in Ansible Vault or an external secret manager.
ansible_connection: winrm
ansible_port: 5986
ansible_winrm_scheme: https
ansible_winrm_transport: kerberos
ansible_winrm_server_cert_validation: validate
ansible_winrm_operation_timeout_sec: 60
ansible_winrm_read_timeout_sec: 90
ansible_user: svc_ansible@GRUPOTVCABLE.COM
ansible_password: "{{ vault_windows_svc_ansible_password }}"
